<!DOCTYPE html>
<html>
<head>
     <title>Anubis's website</title>
     <style>
        @font-face {
            font-family: 'MomoTrustDisplay-Regular';
            src: url('fonts/MomoTrustDisplay-Regular.ttf');
        }

        body {
            font-family: 'MomoTrustDisplay-Regular', sans-serif;
            color: whitesmoke
            }
        
            .container {
            display: flex;
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
            }
        
            section {
                flex: 3;
                background-color: rgba(0, 15, 35, 0.85);
                border: 2px solid white;
                padding: 20px;
                box-sizing: border-box;
                }
            
            aside {
                flex: 1;
                background-color: rgba(0, 15, 35, 0.85);
                border: 2px solid white;
                padding: 20px;
                box-sizing: border-box;
                }
            aside img {
                max-width: 100%;
                height: auto;
                display: block;
                }
            a {
                color: white;
                text-decoration: none;
                }
            
            a:hover {
                text-decoration: underline;
                }
            
            h1 {
                text-align: center;
                margin-bottom: 20px;
                }
            .preview-box img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
                }

            .preview-box {
                width: 285px;
                height: 190px;
                overflow: hidden;
                border: 1px white;
                }
            
            .update-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 15px;
                margin-bottom: 25px;
                }
            
            .copyright-box {
                border: 2px white;
                text-align: center;
                padding: 12px;
                margin-top: 20px;
                font-size: 1.1rem;
                }

            .card {
                flex: 1;
                }

            .updates-grid {
                display: flex;
                gap: 20px;
                }

            .gallery-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
                margin-bottom: 25px;
                }
                
            .gallery-item {
                border: 1px white;
                padding: 8px;
                background-color: rgba(0, 0, 0, 0.3);
                }

            .gallery-item img {
                width: 285px;
                height: 190px;
                object-fit: cover;
                display: block;
                }

            .photo-caption {
                text-align: center;
                font-size: 0.95rem;
                margin-top: 8px;
                margin-bottom: 4px;
                }

     </style>
</head>
    <body background="images/stars-background.jpg">
        <h1>>>Anubis's website</h1>
        <div class="container">
        <section>
            <h2 class="section-heading">Projects & blogs</h2>
            <p>This acts as a "portfolio" where you can find my photos, designs or art (if i actualy make any soon)</p>
            <hr class="section-divider">

            <div class="gallery-grid">
                <div class="gallery-item">
                    <a href="projects/stadler-gtw.html">
                    <img src="project images/stadler v TT.jpg" alt="stadler tt">
                    </a>
                    <p class="photo-caption">Stadler GTW in TT scale</p>
                </div>

                <div class="gallery-item">
                    <a href="projects/what to expect.html">
                    <img src="project images/what to expect.png" alt="stadler tt">
                    </a>
                    <p class="photo-caption">What to expect?</p>
                </div>

            </div>
        <hr class="section-divider">
        
         <div class="copyright-box">
               <small>
                ©2026 Anubis_ir All rights reserved
               </small>
            </div>
        </section>

        <aside>
            <h3>Menu</h3>
            <p><a href="index.html">Home</a></p>
            <p><a href="about.html">About</a></p>
            <p><a href="photos.html">Photos</a></p>
            <p><a href="projects.html">Projects</a></p>

            <hr style="border: 1px solid white; margin: 15px 0;">
            <h3>socials</h3>
            <img src="images/socials.png" alt="Socials">
        </aside>
        </div>
        <h1 class="site-header">&gt;&gt;Anubis's website</h1>
    </body>
</html>
